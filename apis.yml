name: Mayflower
description: Mayflower is an early-stage (Y Combinator, Fall 2025) startup building an AI-powered HR plug-in
  that automates immigration screening, visa eligibility assessment, and compliance for international hiring.
  The platform parses candidate documents, classifies visa pathways, and generates attorney-ready forms,
  integrating directly with existing HR systems so companies can surface only compliant candidates and
  reduce legal risk. Founded in 2025 by Naren Chittem and Aryan Gulati and based in San Francisco, the
  company currently operates a marketing landing page with a book-a-call motion and publishes no public
  API, developer documentation, SDKs, or GitHub organization. This profile was added to the API Evangelist
  network as a Y Combinator portfolio lead; the enrichment pipeline found no API surface to harvest.
